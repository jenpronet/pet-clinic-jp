name: CI Pipeline - Célula Clinic

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  IMAGE_NAME: spring-petclinic

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build – compila el proyecto y publica el JAR como artefacto
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "1 · Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesario para SonarCloud en el job SAST

      - name: Configurar JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Compilar y empaquetar (sin tests)
        run: |
          mvn -B package -DskipTests

      - name: Publicar JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/spring-petclinic-*.jar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: SAST – análisis estático con SonarCloud
  #   Falla si el Quality Gate detecta vulnerabilidades críticas/altas/medias.
  #   Secrets requeridos en el repositorio:
  #     - SONAR_TOKEN       → token de usuario en sonarcloud.io
  #     - SONAR_ORG         → slug de la organización en SonarCloud
  #     - SONAR_PROJECT_KEY → clave del proyecto en SonarCloud
  # ─────────────────────────────────────────────────────────────────────────────
  sast:
    name: "2 · SAST – SonarCloud"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORG }} \
            -Dsonar.host.url=https://sonarcloud.io

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: SCA – análisis de composición de software con OWASP Dependency Check
  #   Falla con CVSS >= 4.0 (Medium, High, Critical).
  #   Secret opcional:
  #     - NVD_API_KEY → acelera la descarga de la base NVD (recomendado)
  # ─────────────────────────────────────────────────────────────────────────────
  sca:
    name: "3 · SCA – OWASP Dependency Check"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true   # vulnerabilidades detectadas no bloquean el pipeline

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Restaurar caché NVD (OWASP DC)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          # clave con fecha semanal → restaura cache de semanas anteriores y guarda uno nuevo
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ github.run_number }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-
            owasp-nvd-${{ runner.os }}-

      - name: Compilar proyecto (generar JARs de dependencias)
        run: mvn -B package -DskipTests

      - name: SCA – OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=4 \
            -Dformat=HTML \
            -DoutputDirectory=reports \
            -Dorg.owasp.dependencycheck.data.directory="${HOME}/.m2/repository/org/owasp/dependency-check-data" \
            ${NVD_API_KEY:+-DnvdApiKey=${NVD_API_KEY}}

      - name: Publicar reporte SCA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report
          path: reports/

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Docker Build – construye la imagen Docker
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "4 · Docker Build"
    runs-on: ubuntu-latest
    needs: [sast, sca]

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Compilar JAR
        run: |
          mvn -B package -DskipTests

      - name: Construir imagen Docker
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Guardar imagen Docker como artefacto
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip > docker-image.tar.gz

      - name: Publicar imagen Docker
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Image Security – escaneo de vulnerabilidades con Trivy
  #   Falla si se detectan vulnerabilidades CRITICAL, HIGH o MEDIUM.
  # ─────────────────────────────────────────────────────────────────────────────
  image-security:
    name: "5 · Image Security – Trivy"
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Descargar imagen Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Cargar imagen Docker
        run: docker load < docker-image.tar.gz

      - name: Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: false
          severity: "CRITICAL,HIGH,MEDIUM"
          output: "trivy-results.txt"

      - name: Publicar reporte Trivy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-results.txt
