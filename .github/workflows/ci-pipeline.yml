name: CI Pipeline - Célula Clinic

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  IMAGE_NAME: spring-petclinic

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build – compila el proyecto y publica el JAR como artefacto
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "1 · Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesario para SonarCloud en el job SAST

      - name: Configurar JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Compilar y empaquetar (sin tests)
        run: |
          mvn -B package -DskipTests

      - name: Publicar JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/spring-petclinic-*.jar
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: SAST – análisis estático con SonarCloud
  #   Falla si el Quality Gate detecta vulnerabilidades críticas/altas/medias.
  #   Secrets requeridos en el repositorio:
  #     - SONAR_TOKEN       → token de usuario en sonarcloud.io
  #     - SONAR_ORG         → slug de la organización en SonarCloud
  #     - SONAR_PROJECT_KEY → clave del proyecto en SonarCloud
  # ─────────────────────────────────────────────────────────────────────────────
  sast:
    name: "2 · SAST – SonarCloud"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Análisis SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORG }} \
            -Dsonar.host.url=https://sonarcloud.io

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: SCA – análisis de composición de software con OWASP Dependency Check
  #   Falla con CVSS >= 4.0 (Medium, High, Critical).
  #   Secret opcional:
  #     - NVD_API_KEY → acelera la descarga de la base NVD (recomendado)
  # ─────────────────────────────────────────────────────────────────────────────
  sca:
    name: "3 · SCA – OWASP Dependency Check"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Ejecutar OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "spring-petclinic"
          path: "."
          format: "HTML"
          args: >
            --failOnCVSS 4
            --enableRetired
        env:
          JAVA_HOME: /opt/jdk
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Publicar reporte SCA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: ${{ github.workspace }}/reports

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Docker Build – construye la imagen Docker
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: "4 · Docker Build"
    runs-on: ubuntu-latest
    needs: [sast, sca]

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      - name: Compilar JAR
        run: |
          mvn -B package -DskipTests

      - name: Construir imagen Docker
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Guardar imagen Docker como artefacto
        run: docker save ${{ env.IMAGE_NAME }}:${{ github.sha }} | gzip > docker-image.tar.gz

      - name: Publicar imagen Docker
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Image Security – escaneo de vulnerabilidades con Trivy
  #   • Paso 1 (SARIF): sube resultados al tab Security de GitHub (sin fallo).
  #   • Paso 2 (tabla): falla solo si existen vulns con fix disponible (CRITICAL/HIGH).
  #   Secrets requeridos:
  #     - GITHUB_TOKEN → permisos para subir SARIF (provisto automáticamente)
  # ─────────────────────────────────────────────────────────────────────────────
  image-security:
    name: "5 · Image Security – Trivy"
    runs-on: ubuntu-latest
    needs: docker-build
    permissions:
      security-events: write   # necesario para subir SARIF a GitHub Security

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Descargar imagen Docker
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Cargar imagen Docker
        run: docker load < docker-image.tar.gz

      - name: Escanear imagen con Trivy (SARIF → GitHub Security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "0"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Subir resultados SARIF a GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Escanear imagen con Trivy (tabla legible por humanos)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          output: "trivy-results.txt"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Publicar reporte Trivy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-results.txt
