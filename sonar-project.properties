# ─────────────────────────────────────────────────────────────────────────────
# SonarCloud – Configuración del proyecto spring-petclinic
#
# IMPORTANTE: los valores de sonar.projectKey y sonar.organization
# también se pasan desde los secrets de GitHub Actions.
# Este archivo sirve como referencia y para ejecución local.
#
# Para ejecutar localmente:
#   SONAR_TOKEN=<tu-token> ./mvnw sonar:sonar
# ─────────────────────────────────────────────────────────────────────────────

# Identificadores del proyecto en SonarCloud
# (deben coincidir con los secrets SONAR_PROJECT_KEY y SONAR_ORG del repo)
sonar.projectKey=jenpronet_pet-clinic-jp
sonar.organization=jenpronet

# Nombre y versión que aparece en el dashboard
sonar.projectName=spring-petclinic
sonar.projectVersion=2.6.0-SNAPSHOT

# Código fuente y tests
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusiones (recursos estáticos, configuración)
sonar.exclusions=src/main/resources/**,src/main/webapp/**

# Cobertura (generada por JaCoCo durante mvn verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Quality Gate: el pipeline falla si el Quality Gate no pasa.
# Configura el Quality Gate en sonarcloud.io para que falle en:
#   - Vulnerabilidades nuevas con severidad >= MEDIUM
#   - Security Hotspots no revisados
# El parámetro sonar.qualitygate.wait=true en el pipeline garantiza
# que el job de CI espere el resultado antes de continuar.
